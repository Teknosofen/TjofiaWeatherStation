; TjofiaWeatherStation — ESP32 Huzzah32 / Adafruit Feather ESP32

[common]
platform  = espressif32
board     = featheresp32
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1

[env:featheresp32]
extends = common
board_build.partitions = partitions.csv
build_src_filter = +<*> -<demo/>
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit GFX Library @ ^1.11.0

; Flash this to test both stepper motors before final assembly.
; Needles must be at physical zero (minimum stop) before upload.
[env:demo]
extends = common
build_src_filter = -<*> +<demo/>
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.0
